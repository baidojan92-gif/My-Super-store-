
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY SUPER STORE POS</title>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:15px}
header{background:#075e45;color:white;padding:20px;text-align:center;border-radius:12px}
.card{background:white;padding:15px;margin:12px 0;border-radius:12px}
input,select,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{background:#087b55;color:white;border:0;font-weight:bold}
table{width:100%;background:white;border-collapse:collapse}
td,th{padding:9px;border:1px solid #ddd;text-align:left}
h3{color:#075e45}
</style>
</head>
<body>
<header>
<h2>MY SUPER STORE POS</h2>
<p>Super Store Management System</p>
</header>

<div class="card">
<h3>Add New Product</h3>
<input id="name" placeholder="Product Name">
<select id="unit">
<option>KG</option>
<option>Gram</option>
<option>Liter</option>
<option>Packet</option>
<option>Piece</option>
<option>Dozen</option>
<option>Open Item</option>
</select>
<input id="buy" type="number" placeholder="Purchase Price">
<input id="sell" type="number" placeholder="Selling Price">
<input id="stock" type="number" placeholder="Stock Quantity">
<button onclick="addProduct()">Add Product</button>
</div>

<div class="card">
<h3>Products / سامان</h3>
<table>
<thead><tr><th>Name</th><th>Unit</th><th>Stock</th><th>Price</th></tr></thead>
<tbody id="products"></tbody>
</table>
</div>

<div class="card">
<h3>Sales / فروخت</h3>
<select id="product"></select>
<input id="qty" type="number" step="0.001" placeholder="Quantity">
<button onclick="sellProduct()">Sell Product</button>
<h3 id="total">Total: Rs 0</h3>
<h3 id="profit">Profit: Rs 0</h3>
</div>

<div class="card">
<h3>Sales History</h3>
<div id="history"></div>
</div>

<script>
let products=JSON.parse(localStorage.getItem("products")||"[]");
let history=JSON.parse(localStorage.getItem("history")||"[]");

function save(){
localStorage.setItem("products",JSON.stringify(products));
localStorage.setItem("history",JSON.stringify(history));
}

function render(){
document.getElementById("products").innerHTML=products.map(p=>
`<tr><td>${p.name}</td><td>${p.unit}</td><td>${p.stock}</td><td>Rs ${p.sell}</td></tr>`).join("");

document.getElementById("product").innerHTML=
products.map((p,i)=>`<option value="${i}">${p.name} (${p.unit})</option>`).join("");

document.getElementById("history").innerHTML=history.map(h=>
`<p>${h.name} - ${h.qty} ${h.unit} = Rs ${h.total}</p>`).join("");
}

function addProduct(){
let name=document.getElementById("name").value.trim();
let unit=document.getElementById("unit").value;
let buy=Number(document.getElementById("buy").value);
let sell=Number(document.getElementById("sell").value);
let stock=Number(document.getElementById("stock").value);
if(!name||buy<0||sell<=0||stock<0||!document.getElementById("sell").value||!document.getElementById("stock").value){alert("Please enter valid product details");return;}
products.push({name,unit,buy,sell,stock});
save();render();alert("Product Added!");
}

function sellProduct(){
let i=Number(document.getElementById("product").value);
let qty=Number(document.getElementById("qty").value);
if(!products.length||!qty||qty<=0||!Number.isInteger(i)||!products[i]||qty>products[i].stock){alert("Check product and available stock");return;}
let p=products[i];
let total=qty*p.sell;
let profit=qty*(p.sell-p.buy);
p.stock-=qty;
history.unshift({name:p.name,qty,unit:p.unit,total});
document.getElementById("total").innerText="Total: Rs "+total.toFixed(2);
document.getElementById("profit").innerText="Profit: Rs "+profit.toFixed(2);
save();render();
document.getElementById("qty").value="";
}
render();
</script>
</body>
</html>
